# MediaMTX — RTMP ingest + recording + HLS serving
# OBS → Restream → this server (records + HLS) + YouTube/Facebook/Twitch (live audiences)

rtmpAddress: :1935
hlsAddress: :8888
hlsAllowOrigin: '*'

# Unused protocols use valid addresses so v1.x validation passes.
# Ports 8554/8189/8890 are not open in the EC2 security group — unreachable externally.
rtspAddress: :8554
webrtcAddress: :8189
srtAddress: :8890

# Only allow publishing with the correct stream key. MediaMTX does not expand ${VAR}
# syntax in this file itself — deploy.yml substitutes the real RTMP_STREAM_KEY value
# into the line below after copying this file to the EC2 host, before the container starts.
# Anonymous reads are allowed so HLS viewers and CloudFront can fetch segments/manifests.
authMethod: internal
authInternalUsers:
  - user: stream
    pass: "${RTMP_STREAM_KEY}"
    permissions:
      - action: publish
        path: live
  - user: any
    permissions:
      - action: read
        path: live

# Server-side recording is OFF. The 20 GB root volume cannot safely hold a long stream, and
# stream uptime beats having a third copy of the video: OBS records locally and Restream keeps
# its own copy, so this one was redundant.
#
# Why it is genuinely unsafe to leave on for a long stream: a recording file is only closed --
# and therefore only uploadable and deletable by vod-watcher -- at recordSegmentDuration. That
# defaults to 1h and was never overridden here, so an in-progress hour of video accumulates on
# disk with nothing able to reclaim it (disk-watchdog deliberately never purges an in-progress
# recording). At ~20 GB/h that exhausts the ~12 GB free in roughly half an hour and takes RTMP
# and HLS down mid-show -- the 2026-07-19 outage.
#
# This was masked until now: a broken healthcheck had autoheal restarting mediamtx every ~2 min
# (fixed in #296), which closed the file constantly and let vod-watcher drain the disk by
# accident. Fixing the restart loop removed that unintended safety net.
#
# To re-enable, set `record: yes`. recordSegmentDuration is pre-set to 5m below so recording is
# bounded from the moment it is switched back on -- do NOT remove it and fall back to the 1h
# default. At 20 GB/h a 5m segment is ~1.7 GB, which vod-watcher uploads and deletes well inside
# the next segment. Before re-enabling for a multi-hour stream, confirm `df -h /` has headroom
# for several segments, not just one.
record: no
recordPath: /recordings/%path/%Y-%m-%dT%H-%M-%S.mp4
recordFormat: fmp4
recordSegmentDuration: 5m
recordDeleteAfter: 0s   # vod-watcher.service uploads to S3 and handles cleanup

paths:
  live:
    source: publisher
    # Fires the instant OBS/Restream starts publishing — triggers the go-live social
    # notification workflow in n8n. deploy.yml substitutes ${N8N_WEBHOOK_SECRET} the
    # same way it already does for ${RTMP_STREAM_KEY} above.
    runOnReady: >
      curl -s -X POST https://n8n.stpetemusic.live/webhook/go-live
      -H "Content-Type: application/json"
      -H "X-N8N-Webhook-Secret: ${N8N_WEBHOOK_SECRET}"
      -d "{\"event\": \"stream_started\", \"path\": \"$MTX_PATH\"}"

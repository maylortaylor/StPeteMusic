name: Sync Social Images to CDN

on:
  push:
    branches: [main]
    paths: ['apps/web/social-images/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Optimize images
        run: |
          sudo apt-get install -y pngquant --quiet
          for FILE in apps/web/social-images/*-header.png; do
            [ -f "$FILE" ] || continue
            BEFORE=$(du -sh "$FILE" | cut -f1)
            TMP=$(mktemp /tmp/opt-XXXXXX.png)
            if pngquant --quality 60-95 --speed 1 --strip --force --output "$TMP" "$FILE"; then
              mv "$TMP" "$FILE"
              AFTER=$(du -sh "$FILE" | cut -f1)
              echo "  $(basename "$FILE"): ${BEFORE} → ${AFTER}"
            else
              rm -f "$TMP"
              echo "  $(basename "$FILE"): skipped (kept original ${BEFORE})"
            fi
          done

      - name: Upload images and generate social-images.ts
        run: |
          CDN_BASE="https://cdn.stpetemusic.live/social"
          BUCKET="stpetemusic-assets"
          OUT="apps/web/src/config/social-images.ts"

          {
            echo "// AUTO-GENERATED by .github/workflows/social-images-sync.yml — do not edit manually."
            echo "// Run the workflow via Actions → \"Sync Social Images to CDN\" → \"Run workflow\" to update."
            echo "export const socialImages = {"
          } > "$OUT"

          for FILE in apps/web/social-images/*-header.png; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE" .png)     # e.g. "homepage-header"
            CONFIG_KEY="${BASENAME%-header}"       # strips "-header" → "homepage"
            HASH=$(sha256sum "$FILE" | cut -c1-8)
            S3_KEY="social/${BASENAME}-${HASH}.png"
            CDN_URL="${CDN_BASE}/${BASENAME}-${HASH}.png"

            echo "  Uploading ${BASENAME}.png → ${S3_KEY}"
            aws s3 cp "$FILE" "s3://${BUCKET}/${S3_KEY}" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress

            echo "  ${CONFIG_KEY}: '${CDN_URL}'," >> "$OUT"
          done

          echo "} as const;" >> "$OUT"
          echo "" >> "$OUT"
          echo "export type SocialImageKey = keyof typeof socialImages;" >> "$OUT"

      - name: Invalidate CloudFront cache
        env:
          CDN_DISTRIBUTION_ID: ${{ vars.CDN_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CDN_DISTRIBUTION_ID" \
            --paths "/social/*"

      - name: Open PR with updated social-images.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/config/social-images.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="chore/social-images-sync-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update social image CDN urls after asset sync"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update social image CDN urls after asset sync" \
            --body "Automated update from the **Sync Social Images to CDN** workflow (run ${{ github.run_id }}) after uploading optimized images to the CDN."

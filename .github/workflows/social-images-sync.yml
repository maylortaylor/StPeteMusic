name: Sync Social Images to CDN

on:
  push:
    branches: [main]
    paths: ['apps/web/social-images/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload images and generate social-images.ts
        run: |
          CDN_BASE="https://cdn.stpetemusic.live/social"
          BUCKET="stpetemusic-assets"
          OUT="apps/web/src/config/social-images.ts"

          {
            echo "// AUTO-GENERATED by .github/workflows/social-images-sync.yml — do not edit manually."
            echo "// Run the workflow via Actions → \"Sync Social Images to CDN\" → \"Run workflow\" to update."
            echo "export const socialImages = {"
          } > "$OUT"

          for FILE in apps/web/social-images/*-header.png; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE" .png)     # e.g. "homepage-header"
            CONFIG_KEY="${BASENAME%-header}"       # strips "-header" → "homepage"
            HASH=$(sha256sum "$FILE" | cut -c1-8)
            S3_KEY="social/${BASENAME}-${HASH}.png"
            CDN_URL="${CDN_BASE}/${BASENAME}-${HASH}.png"

            echo "  Uploading ${BASENAME}.png → ${S3_KEY}"
            aws s3 cp "$FILE" "s3://${BUCKET}/${S3_KEY}" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress

            echo "  ${CONFIG_KEY}: '${CDN_URL}'," >> "$OUT"
          done

          echo "} as const;" >> "$OUT"
          echo "" >> "$OUT"
          echo "export type SocialImageKey = keyof typeof socialImages;" >> "$OUT"

      - name: Invalidate CloudFront cache
        env:
          CDN_DISTRIBUTION_ID: ${{ vars.CDN_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CDN_DISTRIBUTION_ID" \
            --paths "/social/*"

      - name: Commit updated social-images.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/config/social-images.ts
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update social image CDN urls after asset sync"
          git push

      - name: Trigger Facebook re-scrape
        # Forces Facebook to re-crawl each page's OG tags. Since the og:image URL
        # now contains a new content hash, Facebook fetches the updated image immediately.
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          PAGES=(
            "https://www.stpetemusic.live"
            "https://www.stpetemusic.live/about"
            "https://www.stpetemusic.live/events"
            "https://www.stpetemusic.live/discover"
            "https://www.stpetemusic.live/live"
            "https://www.stpetemusic.live/venues"
            "https://www.stpetemusic.live/tickets"
          )
          for PAGE in "${PAGES[@]}"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$PAGE', safe=''))")
            echo "Scraping: $PAGE"
            curl -s -X POST \
              "https://graph.facebook.com/?id=${ENCODED}&scrape=true&access_token=${FB_ACCESS_TOKEN}" \
              | python3 -m json.tool || true
          done

name: Fallow

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Run fallow audit
        uses: fallow-rs/fallow@e36026dfc0f00bfdf8dab889efc58ab86e5ec466  # v2.104.0
        with:
          command: audit
          comment: true
          review-comments: true
          # fail-on-issues defaults to true: fails the job only on verdict
          # "fail" — "warn"-tier findings are posted but never block the PR.

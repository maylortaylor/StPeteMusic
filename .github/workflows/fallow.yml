name: Fallow

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run fallow audit
        uses: fallow-rs/fallow@28810138faa8fdbc830b8d585d0c15d65c39c3fd  # v3.10.0
        with:
          command: audit
          comment: true
          review-comments: true
          # fail-on-issues defaults to true: fails the job only on verdict
          # "fail" — "warn"-tier findings are posted but never block the PR.

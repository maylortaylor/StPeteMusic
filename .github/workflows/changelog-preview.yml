name: Changelog Preview

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  changelog-preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Generate changelog for this PR
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        id: git-cliff
        with:
          config: cliff.toml
          # Scope generation to just this PR's commits (base..head), not the
          # whole project history — that's what makes this a per-MR preview.
          args: --strip header ${{ github.event.pull_request.base.sha }}..HEAD

      - name: Post changelog preview to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const content = `${{ steps.git-cliff.outputs.content }}`;
            const body = content.trim()
              ? `#### Changelog Preview 📝\n\n${content}\n\n*Generated by git-cliff from this PR's commits.*`
              : `#### Changelog Preview 📝\n\nNo changelog-worthy commits detected in this PR.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

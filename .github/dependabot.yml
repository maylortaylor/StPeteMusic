version: 2
updates:
  # Keep Docker base images up to date (n8n version bumps)
  - package-ecosystem: "docker"
    directory: "/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # Same reasoning as npm: action bumps are almost always one-line SHA changes
    # and are far easier to review as a single PR. Majors stay ungrouped.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

version: 2
updates:
  # Keep Docker base images up to date (n8n version bumps)
  - package-ecosystem: "docker"
    directory: "/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Keep npm packages up to date. This is an npm-workspaces monorepo with a
  # single root package-lock.json (apps/*, packages/*) — directory must be
  # "/" so Dependabot updates the shared lockfile correctly. Pointing this at
  # a workspace subdirectory (e.g. "/apps/web") leaves package-lock.json out
  # of sync with the bumped package.json, which fails `npm ci` in CI for
  # every PR Dependabot opens.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
